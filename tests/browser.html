<!doctype html><html lang="en"><meta charset="utf-8"><title>Bleep Studio browser audio tests</title><style>body{background:#141614;color:#eef0e8;font:14px/1.6 system-ui;padding:30px}button{background:#c3f36b;padding:14px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}audio{height:32px;width:240px}li{padding:6px}</style><h1>Browser audio validation</h1><p>Real OfflineAudioContext rendering. Checks all 54 sounds at 44.1 and 48 kHz, minimum and maximum settings, finite samples, signal levels, fade endpoints, repeatability and seed variation.</p><button id="run">Run audio suite</button><pre id="result">Ready</pre><button id="export" disabled>Download validation sound pack</button><ul id="auditions"></ul><script src="../engine.js"></script><script>
const output=document.getElementById('result'),button=document.getElementById('run'),files=[];
function assert(ok,message){if(!ok)throw new Error(message)}
button.onclick=async()=>{button.disabled=true;files.length=0;document.getElementById('auditions').replaceChildren();let count=0,lowest=1,highest=0;try{
for(const style of Object.keys(Bleep.STYLES))for(const sound of Bleep.SOUNDS)for(const [rate,p]of [[44100,{}],[48000,{}],[44100,{pitch:-12,duration:.4,brightness:0,punch:0,room:0}],[48000,{pitch:12,duration:2,brightness:100,punch:100,room:70}]]){
const b=await Bleep.render(sound.id,style,p,rate),data=b.getChannelData(0);let peak=0,sum=0;for(const s of data){assert(Number.isFinite(s),'Non-finite sample');peak=Math.max(peak,Math.abs(s));sum+=s*s;}assert(peak>.00001,'Silent sound: '+style+'/'+sound.id);assert(peak<=.901,'Clipped sound');assert(data[0]===0&&data[data.length-1]===0,'Unfaded endpoints');assert(b.sampleRate===rate,'Sample rate mismatch');lowest=Math.min(lowest,peak);highest=Math.max(highest,peak);count++;
if(rate===44100&&Object.keys(p).length===0){const wav=Bleep.wav(b);files.push({name:style+'/'+sound.id+'.wav',data:wav});const li=document.createElement('li'),audio=document.createElement('audio');audio.controls=true;audio.src=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));li.append(style+' / '+sound.id+' ',audio);document.getElementById('auditions').append(li);}
output.textContent='Rendering '+count+'/216';}
const a=await Bleep.render('explosion','space',{seed:123}),b=await Bleep.render('explosion','space',{seed:123}),c=await Bleep.render('explosion','space',{seed:124});let diff=0,variation=0;for(let i=0;i<a.length;i++){diff=Math.max(diff,Math.abs(a.getChannelData(0)[i]-b.getChannelData(0)[i]));variation+=Math.abs(a.getChannelData(0)[i]-c.getChannelData(0)[i]);}assert(diff<.00001,'Nonrepeatable rendering '+diff);assert(variation>1,'Seed does not change audio');
const report={status:'PASS',renders:count,catalogSounds:54,sampleRates:[44100,48000],lowestPeak:lowest,highestPeak:highest,repeatMaxError:diff,seedVariation:variation};output.textContent=JSON.stringify(report,null,2);files.push({name:'validation.json',data:JSON.stringify(report,null,2)});document.getElementById('export').disabled=false;
}catch(e){output.textContent='FAIL: '+e.stack;}finally{button.disabled=false;}};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Bleep.zip(files)],{type:'application/zip'}));a.download='bleep-validation-54-sounds.zip';a.click();};
</script></html>
