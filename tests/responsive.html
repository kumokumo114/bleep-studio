<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive layout checks</title><style>body{margin:0;padding:20px;background:#101310;color:#eee;font:14px system-ui}h1{font-size:20px}section{margin:20px 0}iframe{display:block;border:1px solid #526146;height:850px;background:#141614}pre{white-space:pre-wrap;color:#c3f36b}</style><h1>Bleep Studio — responsive layout fixtures</h1><p>Each frame uses its own real CSS viewport. Page content is identical to the shipped app.</p><pre id="report">Checking…</pre><section><h2>375 px / small phone</h2><iframe id="phone" title="375 pixel phone" src="../index.html" width="375"></iframe></section><section><h2>768 px / tablet</h2><iframe id="tablet" title="768 pixel tablet" src="../index.html" width="768"></iframe></section><section><h2>1024 px / small desktop</h2><iframe id="small-desktop" title="1024 pixel desktop" src="../index.html" width="1024"></iframe></section><section><h2>1440 px / desktop</h2><iframe id="desktop" title="1440 pixel desktop" src="../index.html" width="1440"></iframe></section><script>
const frames=[...document.querySelectorAll('iframe')];
function check(){if(frames.some(f=>!f.contentDocument.querySelector('.sound-card')))return;document.getElementById('report').textContent=JSON.stringify(frames.map(f=>{const w=f.contentWindow,d=f.contentDocument;return{width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,pass:d.documentElement.scrollWidth<=w.innerWidth,sounds:d.querySelectorAll('.sound-card').length,columns:w.getComputedStyle(d.querySelector('.sound-grid')).gridTemplateColumns};}),null,2);}
frames.forEach(f=>f.addEventListener('load',check));
</script></html>
